<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 778" role="img" aria-labelledby="arch-t arch-d" class="arch"><title id="arch-t">QuantGate architecture</title><desc id="arch-d">The bench (SO-101 arms, cameras, a Jetson Orin Nano Super running the TensorRT engine, trial runner and preflight), Nebius AI Cloud (training and fine-tunes on L40S, the CPU audit fan-out, Cosmos-Reason2 as the trial judge, Nemotron 3 Super for words only, MLflow), the workstation that quantizes the checkpoint, and the repository where code turns sealed logs into verdicts, decisions and next tests; datasets, code, dashboard and video are public.</desc><style>
.zone{fill:none;stroke:var(--rule, #D3D9D7);stroke-width:1.2} .zone.cloud{stroke:var(--plum, #6B4C9A);stroke-dasharray:5 4} .zone.arm{stroke:var(--ember, #A8430F)}
.zone.repo{stroke:var(--signal, #00909B)} .zone.pub{stroke:var(--ink-3, #5A646C);stroke-dasharray:2 4}
.zt{font:600 15px system-ui,sans-serif;fill:var(--ink, #14181C)} .zs{font:12px system-ui,sans-serif;fill:var(--ink-3, #5A646C)}
.box{fill:var(--plate, #FAFBFA);stroke:var(--rule, #D3D9D7)} .bar.arm{fill:var(--ember, #A8430F)} .bar.model{fill:var(--plum, #6B4C9A)} .bar.code{fill:var(--signal, #00909B)} .bar.pub{fill:var(--ink-3, #5A646C)}
.bt{font:600 13px system-ui,sans-serif;fill:var(--ink, #14181C)} .bl{font:11.5px system-ui,sans-serif;fill:var(--ink-2, #3C464E)}
.dev{fill:none;stroke:var(--ember, #A8430F);stroke-width:1.4} .dt{font:600 12.5px system-ui,sans-serif;fill:var(--ember, #A8430F)}
.ar{fill:none;stroke:var(--ink-3, #5A646C);stroke-width:1.4} .ar.data{stroke:var(--signal, #00909B)} .ar.model{stroke:var(--plum, #6B4C9A)}
.al{font:italic 11px system-ui,sans-serif;fill:var(--ink-2, #3C464E)} .lg{font:11px system-ui,sans-serif;fill:var(--ink-3, #5A646C)}
</style><rect x="0" y="0" width="1280" height="778" fill="#F1F3F2"/><defs><marker id="ah-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3, #5A646C)"/></marker><marker id="ah-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--signal, #00909B)"/></marker><marker id="ah-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--plum, #6B4C9A)"/></marker></defs><rect class="zone work" x="16" y="16" width="248" height="176" rx="10"/><text class="zt" x="30" y="40">Workstation</text><text class="zs" x="30" y="57">quantization (NGC container)</text><rect class="zone cloud" x="272" y="16" width="992" height="176" rx="10"/><text class="zt" x="286" y="40">Nebius AI Cloud</text><text class="zs" x="286" y="57">training, audit fan-out, the AI models</text><rect class="zone arm" x="16" y="216" width="608" height="384" rx="10"/><text class="zt" x="30" y="240">On the bench</text><text class="zs" x="30" y="257">real arm and the edge device</text><rect class="zone repo" x="664" y="216" width="600" height="384" rx="10"/><text class="zt" x="678" y="240">Repository · code decides</text><text class="zs" x="678" y="257"></text><rect class="zone pub" x="16" y="616" width="1248" height="132" rx="10"/><text class="zt" x="30" y="640">Public</text><text class="zs" x="30" y="657">open data, code, review and video</text><rect class="box code" x="32" y="64" width="216" height="112" rx="6"/><rect class="bar code" x="32" y="64" width="4" height="112" rx="2"/><text class="bt" x="46" y="85">TensorRT Model Optimizer</text><text class="bl" x="46" y="103">FP32 checkpoint → ONNX:</text><text class="bl" x="46" y="118">FP16 and 24 INT8</text><text class="bl" x="46" y="133">calibration variants</text><rect class="box model" x="288" y="64" width="182" height="112" rx="6"/><rect class="bar model" x="288" y="64" width="4" height="112" rx="2"/><text class="bt" x="302" y="85">Nebius Jobs · L40S</text><text class="bl" x="302" y="103">ACT 51.6M training and</text><text class="bl" x="302" y="118">the fine-tunes, on the</text><text class="bl" x="302" y="133">HF datasets</text><rect class="box code" x="482" y="64" width="182" height="112" rx="6"/><rect class="bar code" x="482" y="64" width="4" height="112" rx="2"/><text class="bt" x="496" y="85">Nebius Jobs · CPU</text><text class="bl" x="496" y="103">audit: 25 cells,</text><text class="bl" x="496" y="118">2,000 held-out states,</text><text class="bl" x="496" y="133">ranking frozen (LOCK-2)</text><rect class="box model" x="676" y="64" width="182" height="112" rx="6"/><rect class="bar model" x="676" y="64" width="4" height="112" rx="2"/><text class="bt" x="690" y="85">AI Endpoint</text><text class="bl" x="690" y="103">Cosmos-Reason2-2B judges</text><text class="bl" x="690" y="118">each trial from frames;</text><text class="bl" x="690" y="133">validated first</text><rect class="box model" x="870" y="64" width="182" height="112" rx="6"/><rect class="bar model" x="870" y="64" width="4" height="112" rx="2"/><text class="bt" x="884" y="85">Token Factory</text><text class="bl" x="884" y="103">Nemotron 3 Super: words</text><text class="bl" x="884" y="118">only; code rejects any</text><text class="bl" x="884" y="133">number or verdict</text><rect class="box code" x="1064" y="64" width="182" height="112" rx="6"/><rect class="bar code" x="1064" y="64" width="4" height="112" rx="2"/><text class="bt" x="1078" y="85">Managed MLflow</text><text class="bl" x="1078" y="103">experiment record from</text><text class="bl" x="1078" y="118">committed artifacts</text><rect class="box arm" x="32" y="262" width="184" height="60" rx="6"/><rect class="bar arm" x="32" y="262" width="4" height="60" rx="2"/><text class="bt" x="46" y="283">SO-101 leader arm</text><text class="bl" x="46" y="301">teleoperated demos</text><rect class="box arm" x="32" y="334" width="184" height="60" rx="6"/><rect class="bar arm" x="32" y="334" width="4" height="60" rx="2"/><text class="bt" x="46" y="355">Cameras</text><text class="bl" x="46" y="373">overhead · wrist</text><rect class="box arm" x="32" y="406" width="184" height="60" rx="6"/><rect class="bar arm" x="32" y="406" width="4" height="60" rx="2"/><text class="bt" x="46" y="427">SO-101 follower</text><text class="bl" x="46" y="445">driven by the policy</text><rect class="dev" x="232" y="262" width="376" height="326" rx="8"/><text class="dt" x="246" y="284">Jetson Orin Nano Super · 15 W · 30 Hz</text><rect class="box arm" x="246" y="296" width="348" height="52" rx="6"/><rect class="bar arm" x="246" y="296" width="4" height="52" rx="2"/><text class="bt" x="260" y="317">TensorRT engine</text><text class="bl" x="260" y="335">FP32 · FP16 · 24 INT8 (26 candidates)</text><rect class="box code" x="246" y="358" width="348" height="52" rx="6"/><rect class="bar code" x="246" y="358" width="4" height="52" rx="2"/><text class="bt" x="260" y="379">Trial runner</text><text class="bl" x="260" y="397">sealed, interleaved, operator-blind schedule</text><rect class="box code" x="246" y="420" width="348" height="52" rx="6"/><rect class="bar code" x="246" y="420" width="4" height="52" rx="2"/><text class="bt" x="260" y="441">Preflight</text><text class="bl" x="260" y="459">engine hash · norm manifest · 200 ms deadline</text><rect class="box arm" x="246" y="482" width="348" height="92" rx="6"/><rect class="bar arm" x="246" y="482" width="4" height="92" rx="2"/><text class="bt" x="260" y="503">Cost measurement</text><text class="bl" x="260" y="521">trtexec + tegrastats</text><text class="bl" x="260" y="536">FP16 11.6 ms · 82 mJ per inference,</text><text class="bl" x="260" y="551">faster than INT8 on this device</text><rect class="box code" x="680" y="262" width="280" height="56" rx="6"/><rect class="bar code" x="680" y="262" width="4" height="56" rx="2"/><text class="bt" x="694" y="283">Sealed logs, post-lock hashes</text><text class="bl" x="694" y="301">22 logs · verify re-checks each hash</text><rect class="box code" x="680" y="334" width="280" height="56" rx="6"/><rect class="bar code" x="680" y="334" width="4" height="56" rx="2"/><text class="bt" x="694" y="355">Verdict table</text><text class="bl" x="694" y="373">Newcombe intervals, pre-registered rules</text><rect class="box code" x="680" y="406" width="280" height="64" rx="6"/><rect class="bar code" x="680" y="406" width="4" height="64" rx="2"/><text class="bt" x="694" y="427">Deployment decision</text><text class="bl" x="694" y="445">GO · HOLD · BLOCK, and the next</text><text class="bl" x="694" y="460">test's trials per arm, by code</text><rect class="box code" x="680" y="486" width="280" height="100" rx="6"/><rect class="bar code" x="680" y="486" width="4" height="100" rx="2"/><text class="bt" x="694" y="507">Pre-registrations, decision log</text><text class="bl" x="694" y="525">rules locked before outcomes</text><text class="bl" x="694" y="540">(LOCK-1 to LOCK-4); every</text><text class="bl" x="694" y="555">amendment and error logged</text><rect class="box code" x="976" y="262" width="272" height="56" rx="6"/><rect class="bar code" x="976" y="262" width="4" height="56" rx="2"/><text class="bt" x="990" y="283">Review report</text><text class="bl" x="990" y="301">the report, with Nemotron's words</text><rect class="box code" x="976" y="334" width="272" height="72" rx="6"/><rect class="bar code" x="976" y="334" width="4" height="72" rx="2"/><text class="bt" x="990" y="355">QuantGate CLI</text><text class="bl" x="990" y="373">judge · tally · card · preflight</text><text class="bl" x="990" y="388">for any team's logs; bad input exits 2</text><rect class="box code" x="976" y="422" width="272" height="72" rx="6"/><rect class="bar code" x="976" y="422" width="4" height="72" rx="2"/><text class="bt" x="990" y="443">GitHub Actions</text><text class="bl" x="990" y="461">tests; offline review rebuilt</text><text class="bl" x="990" y="476">byte for byte; gate example</text><rect class="box pub" x="32" y="664" width="296" height="70" rx="6"/><rect class="bar pub" x="32" y="664" width="4" height="70" rx="2"/><text class="bt" x="46" y="685">Hugging Face datasets</text><text class="bl" x="46" y="703">3 LeRobot v3 datasets:</text><text class="bl" x="46" y="718">120 + 50 + 50 demonstrations</text><rect class="box pub" x="344" y="664" width="296" height="70" rx="6"/><rect class="bar pub" x="344" y="664" width="4" height="70" rx="2"/><text class="bt" x="358" y="685">GitHub repository</text><text class="bl" x="358" y="703">code, sealed logs, analyses,</text><text class="bl" x="358" y="718">Apache 2.0</text><rect class="box pub" x="656" y="664" width="296" height="70" rx="6"/><rect class="bar pub" x="656" y="664" width="4" height="70" rx="2"/><text class="bt" x="670" y="685">Dashboard</text><text class="bl" x="670" y="703">the review, evidence and</text><text class="bl" x="670" y="718">audit record, in a browser</text><rect class="box pub" x="968" y="664" width="280" height="70" rx="6"/><rect class="bar pub" x="968" y="664" width="4" height="70" rx="2"/><text class="bt" x="982" y="685">Video</text><text class="bl" x="982" y="703">3 min: the arm and</text><text class="bl" x="982" y="718">the decision</text><path class="ar data" d="M288,120 L248,120" marker-end="url(#ah-data)"/><text class="al" x="268" y="188" text-anchor="middle">FP32 checkpoint</text><path class="ar data" d="M210,176 L210,236 L520,236 L520,296" marker-end="url(#ah-data)"/><text class="al" x="300" y="230" text-anchor="start">26 engines (ONNX → TensorRT)</text><path class="ar data" d="M594,322 L612,322 L612,200 L564,200 L564,176" marker-end="url(#ah-data)"/><text class="al" x="558" y="214" text-anchor="end">error vectors</text><path class="ar model" d="M594,376 L620,376 L620,206 L700,206 L700,176" marker-end="url(#ah-model)"/><text class="al" x="640" y="202" text-anchor="start">frames</text><path class="ar data" d="M594,390 L632,390 L632,290 L680,290" marker-end="url(#ah-data)"/><text class="al" x="650" y="270" text-anchor="middle">logs,</text><text class="al" x="650" y="283" text-anchor="middle">videos</text><path class="ar model" d="M858,150 L864,150 L864,200 L910,200 L910,262" marker-end="url(#ah-model)"/><text class="al" x="916" y="238" text-anchor="start">verdict per trial</text><path class="ar flow" d="M820,318 L820,334" marker-end="url(#ah-flow)"/><path class="ar flow" d="M820,390 L820,406" marker-end="url(#ah-flow)"/><path class="ar flow" d="M960,362 L968,362 L968,290 L976,290" marker-end="url(#ah-flow)"/><path class="ar model" d="M1052,176 L1052,262" marker-end="url(#ah-model)"/><text class="al" x="1058" y="238" text-anchor="start">words only</text><path class="ar flow" d="M1150,262 L1150,176" marker-end="url(#ah-flow)"/><text class="al" x="1156" y="238" text-anchor="start">record</text><path class="ar flow" d="M680,446 L594,446" marker-end="url(#ah-flow)"/><text class="al" x="637" y="440" text-anchor="middle">GO only</text><path class="ar flow" d="M216,364 L246,384" marker-end="url(#ah-flow)"/><path class="ar flow" d="M246,400 L216,436" marker-end="url(#ah-flow)"/><text class="al" x="224" y="356" text-anchor="middle">obs</text><text class="al" x="224" y="458" text-anchor="middle">act</text><path class="ar data" d="M32,292 L24,292 L24,700 L32,700" marker-end="url(#ah-data)"/><text class="al" x="28" y="610" text-anchor="start">demos</text><path class="ar flow" d="M1248,290 L1256,290 L1256,644 L804,644 L804,664" marker-end="url(#ah-flow)"/><path class="ar flow" d="M1256,644 L492,644 L492,664" marker-end="url(#ah-flow)"/><rect class="bar arm" x="700" y="756" width="10" height="10" rx="2"/><text class="lg" x="715" y="765">real arm or device</text><rect class="bar model" x="840" y="756" width="10" height="10" rx="2"/><text class="lg" x="855" y="765">an AI model</text><rect class="bar code" x="980" y="756" width="10" height="10" rx="2"/><text class="lg" x="995" y="765">plain code</text><rect class="bar pub" x="1120" y="756" width="10" height="10" rx="2"/><text class="lg" x="1135" y="765">public</text></svg>
